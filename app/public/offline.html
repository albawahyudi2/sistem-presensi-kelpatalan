<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidak ada koneksi</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #171717;
        text-align: center;
        padding: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #ededed;
        }
      }
      button {
        margin-top: 16px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak ada koneksi</h1>
      <p>
        Halaman ini belum tersimpan di perangkat. Sambungkan internet lalu coba
        lagi. Presensi yang sudah Anda simpan tidak hilang dan akan terkirim
        otomatis.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
